@()

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Product Management System</title>
    <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/products.css")">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header với Navigation -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-box"></i>
                    <h1>Quản Lý Sản Phẩm</h1>
                </div>
                <nav class="main-nav">
                    <a href="http://localhost:9006/products/manage" class="nav-link active">
                        <i class="fas fa-box"></i> Sản phẩm
                    </a>
                    <a href="http://localhost:9005/orders/manage" class="nav-link">
                        <i class="fas fa-shopping-cart"></i> Đơn hàng
                    </a>
                </nav>
                <div class="header-actions">
                    <button class="btn btn-primary" id="createProductBtn">
                        <i class="fas fa-plus"></i> Thêm Sản Phẩm
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
        <div class="container">
            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-group">
                    <label for="statusFilter">Lọc theo trạng thái:</label>
                    <select id="statusFilter" class="form-control">
                        <option value="">Tất cả</option>
                        <option value="active">Đang bán</option>
                        <option value="inactive">Ngừng bán</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="btn btn-secondary" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> Làm mới
                    </button>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon total">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalCount">0</h3>
                        <p>Tổng sản phẩm</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon active">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="activeCount">0</h3>
                        <p>Đang bán</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stock">
                        <i class="fas fa-warehouse"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalStock">0</h3>
                        <p>Tổng tồn kho</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon low-stock">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="lowStockCount">0</h3>
                        <p>Sắp hết hàng</p>
                    </div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="table-container">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Mã SP</th>
                            <th>Tên sản phẩm</th>
                            <th>Mô tả</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="7" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-box"></i> <span id="modalTitle">Thêm Sản Phẩm</span></h2>
                <button class="close-btn" onclick="closeProductModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="productName">Tên sản phẩm *</label>
                        <input type="text" id="productName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Mô tả</label>
                        <textarea id="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Giá (VNĐ) *</label>
                            <input type="number" id="price" class="form-control" required min="0" step="1000">
                        </div>
                        <div class="form-group">
                            <label for="stockQuantity">Tồn kho *</label>
                            <input type="number" id="stockQuantity" class="form-control" required min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isActive" checked>
                            <span>Đang bán</span>
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Stock Adjustment Modal -->
    <div id="stockModal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2><i class="fas fa-warehouse"></i> Điều Chỉnh Tồn Kho</h2>
                <button class="close-btn" onclick="closeStockModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="stockForm">
                    <input type="hidden" id="stockProductId">
                    <div class="stock-info">
                        <p><strong>Sản phẩm:</strong> <span id="stockProductName"></span></p>
                        <p><strong>Tồn kho hiện tại:</strong> <span id="currentStock"></span></p>
                    </div>
                    <div class="form-group">
                        <label for="adjustmentType">Loại điều chỉnh</label>
                        <select id="adjustmentType" class="form-control">
                            <option value="increase">Nhập kho (+)</option>
                            <option value="decrease">Xuất kho (-)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="adjustmentQuantity">Số lượng</label>
                        <input type="number" id="adjustmentQuantity" class="form-control" required min="1">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeStockModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Xác nhận
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="@routes.Assets.versioned("javascripts/products.js")"></script>
</body>
</html>
