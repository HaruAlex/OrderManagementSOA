# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile

# Server Configuration
play.server.http.port = 9005

# Database Configuration - SQL Server
db.default.driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
db.default.url = "jdbc:sqlserver://localhost:1433;databaseName=OrderDB;encrypt=false;trustServerCertificate=true"
db.default.username = "sa"
db.default.password = "123456"

# Connection Pool Settings
db.default.hikaricp.minimumIdle = 5
db.default.hikaricp.maximumPoolSize = 10

# Product Service Configuration
product.service.url = "http://localhost:9006"

# CORS Configuration
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = ["*"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type"]
}
