@()

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Order Management System</title>
    <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/orders.css")">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header với Navigation -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-shopping-cart"></i>
                    <h1>Quản Lý Đơn Hàng</h1>
                </div>
                <nav class="main-nav">
                    <a href="http://localhost:9006/products/manage" class="nav-link">
                        <i class="fas fa-box"></i> Sản phẩm
                    </a>
                    <a href="http://localhost:9005/orders/manage" class="nav-link active">
                        <i class="fas fa-shopping-cart"></i> Đơn hàng
                    </a>
                </nav>
                <div class="header-actions">
                    <button class="btn btn-primary" id="createOrderBtn">
                        <i class="fas fa-plus"></i> Tạo Đơn Hàng Mới
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
        <div class="container">
            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-group">
                    <label for="statusFilter">Lọc theo trạng thái:</label>
                    <select id="statusFilter" class="form-control">
                        <option value="">Tất cả</option>
                        <option value="PENDING">Đang chờ</option>
                        <option value="CONFIRMED">Đã xác nhận</option>
                        <option value="SHIPPED">Đang giao</option>
                        <option value="COMPLETED">Hoàn thành</option>
                        <option value="CANCELLED">Đã hủy</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="btn btn-secondary" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> Làm mới
                    </button>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon pending">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="pendingCount">0</h3>
                        <p>Đang chờ</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon confirmed">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="confirmedCount">0</h3>
                        <p>Đã xác nhận</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon shipped">
                        <i class="fas fa-truck"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="shippedCount">0</h3>
                        <p>Đang giao</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon completed">
                        <i class="fas fa-check-double"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="completedCount">0</h3>
                        <p>Hoàn thành</p>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Mã ĐH</th>
                            <th>Khách hàng</th>
                            <th>Số điện thoại</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Ngày tạo</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="7" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Order Modal -->
    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Tạo Đơn Hàng Mới</h2>
                <button class="close-btn" onclick="closeCreateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="createOrderForm">
                    <div class="form-group">
                        <label for="customerName">Tên khách hàng *</label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Số điện thoại</label>
                        <input type="tel" id="customerPhone" class="form-control" placeholder="0901234567">
                    </div>
                    <div class="form-group">
                        <label>Sản phẩm *</label>
                        <div id="orderItemsContainer">
                            <div class="order-item-row">
                                <input type="number" class="form-control product-id" placeholder="Mã sản phẩm" required min="1">
                                <input type="number" class="form-control quantity" placeholder="Số lượng" required min="1">
                                <button type="button" class="btn btn-danger btn-sm" onclick="removeOrderItem(this)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" id="addItemBtn">
                            <i class="fas fa-plus"></i> Thêm sản phẩm
                        </button>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Tạo đơn hàng
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Order Modal -->
    <div id="viewOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-receipt"></i> Chi Tiết Đơn Hàng</h2>
                <button class="close-btn" onclick="closeViewModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="orderDetailsContent">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Edit Order Modal -->
    <div id="editOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Cập Nhật Đơn Hàng</h2>
                <button class="close-btn" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editOrderForm">
                    <input type="hidden" id="editOrderId">
                    <div class="form-group">
                        <label for="editCustomerName">Tên khách hàng</label>
                        <input type="text" id="editCustomerName" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="editCustomerPhone">Số điện thoại</label>
                        <input type="tel" id="editCustomerPhone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="editStatus">Trạng thái</label>
                        <select id="editStatus" class="form-control">
                            <option value="PENDING">Đang chờ</option>
                            <option value="CONFIRMED">Đã xác nhận</option>
                            <option value="SHIPPED">Đang giao</option>
                            <option value="COMPLETED">Hoàn thành</option>
                            <option value="CANCELLED">Đã hủy</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="@routes.Assets.versioned("javascripts/orders.js")"></script>
</body>
</html>
